# Opening greetings for Outbound vs Inbound call modes (default Hindi-English welcoming opener; adapts immediately to farmer's reply)
greetings:
  outbound:
    hi: "नमस्ते जी, मैं किसान सहायक से बोल रही हूँ। मैं आपको कम ब्याज वाली सरकारी कृषि ऋण योजनाओं की जानकारी देने के लिए कॉल कर रही हूँ। क्या आप अभी दो मिनट बात करने के लिए खाली हैं?"
    en: "Namaste! I am calling from Kisan Sahayak to share information about low-interest government agricultural loan schemes for farmers. Are you free for two minutes to talk?"
  inbound:
    hi: "नमस्ते जी, किसान सहायक में आपका स्वागत है। आप अपनी किसी भी भाषा में बात कर सकते हैं। बताइए, आप किस तरह की खेती या पशुपालन करते हैं और आपको किस चीज़ के लिए लोन की जानकारी चाहिए?"
    en: "Namaste! Welcome to Kisan Sahayak. You can speak in any Indian language or English. What kind of farming or livestock work do you do, and what loan or scheme can I help you with today?"
