# Multilingual Speech Configuration — Indic-Transcribe Flex (STT) + Maya 2 Native (TTS) + Silero VAD

vad:
  confidence: 0.62        # Sensitive, natural human speech detection (zero clipped/missed words)
  start_secs: 0.14        # Fast onset so short 1-word answers & opening syllables register cleanly
  stop_secs: 0.75         # Comfortable pause tolerance so farmers are not cut off mid-sentence
  min_volume: 0.30        # Captures soft-spoken words cleanly (barge-in echo is gated client-side while bot speaks)

stt:
  model_id: "bodhan-ai/indic-transcribe-flex"
  mode: "native"          # Native script output for direct LLM + Maya 2 Native alignment
  sample_rate: 16000
  min_speech_ms: 280      # Ignore accidental micro-clicks/pops
  max_segment_secs: 28.0  # Safe window under 30s FastConformer limit

tts:
  model_id: "maya-research/maya2-native"
  sample_rate: 24000
  default_voice: "Vaidehi"
  normalize: true
  voices:
    - id: "Vaidehi"
      label: "Vaidehi (Calm Female)"
      gender: "female"
      style: "Warm, calm, gentle — ideal for rural farmer guidance"
    - id: "Jahnavi"
      label: "Jahnavi (Friendly Female)"
      gender: "female"
      style: "Warm, friendly adult voice across 11 Indic languages"
    - id: "Ahana"
      label: "Ahana (Bright Female)"
      gender: "female"
      style: "Clear, bright youthful female voice"
    - id: "Satvik"
      label: "Satvik (Friendly Male)"
      gender: "male"
      style: "Warm, approachable male counselor voice"
    - id: "Siddhant"
      label: "Siddhant (Clear Male)"
      gender: "male"
      style: "Clear, steady professional male voice"
    - id: "Vasant"
      label: "Vasant (Mature Male)"
      gender: "male"
      style: "Mature, reassuring narrator voice"

# Maps all 27 Bodhan AI Indic-Transcribe-Flex language codes to display names & Maya 2 Native TTS codes (12 native)
